# Items on the cardboard shelf (3 x 3 racks, slot 0 = left when facing the shelf, level 0 = bottom).
#   source: hope   -> assets/third_party/hope/<asset>/<asset>.xml   (LIBERO, MIT)
#           custom -> assets/custom/<asset>/<asset>.xml             (our own real-size objects)
# Five objects only. alphabet_soup is the can the scripted pick/place is tuned for.
items:
  - {name: water_bottle,   source: custom, asset: water_bottle,   shelf: A, level: 1, slot: 0, scale: 0.9}
  - {name: black_tape,     source: custom, asset: black_tape,     shelf: A, level: 1, slot: 1, scale: 0.8}
  - {name: box_cutter,     source: custom, asset: box_cutter,     shelf: A, level: 2, slot: 0, scale: 0.8}
  - {name: milk,           source: hope,   asset: milk,           shelf: A, level: 0, slot: 0, euler_deg: [90, 0, 0], scale: 0.7}
  - {name: alphabet_soup,  source: hope,   asset: alphabet_soup,  shelf: A, level: 0, slot: 2, euler_deg: [90, 0, 0], scale: 0.55}
